*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#F7F7F5;color:#333;line-height:1.8;font-size:16px;max-width:680px;margin:0 auto;padding-bottom:80px}
.topbar{background:#5B8C5A;color:#fff;padding:24px 20px 20px}
.topbar .meta{font-size:13px;opacity:.8;letter-spacing:1px}
.topbar h1{font-size:21px;font-weight:700;margin-top:6px;line-height:1.4}
.topbar .stage{display:inline-block;margin-top:10px;font-size:12px;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:12px}
.intro{background:#fff;padding:16px 20px;border-bottom:1px solid #EEE;font-size:14px;color:#666;line-height:1.7}
.section{background:#fff;margin:10px 0;padding:22px 20px}
.section-tag{font-size:12px;color:#999;letter-spacing:2px;margin-bottom:8px}
h2{font-size:18px;font-weight:700;margin-bottom:6px;color:#222}
h3{font-size:16px;font-weight:700;margin:18px 0 8px;color:#333}
p{font-size:15px;color:#444;margin-bottom:10px}
ul{list-style:none;margin:6px 0 12px}
ul li{font-size:15px;color:#444;padding:4px 0 4px 18px;position:relative}
ul li::before{content:"·";position:absolute;left:4px;color:#aaa;font-weight:bold}
b,strong{font-weight:600;color:#222}
.tip{background:#FFF8E1;border-radius:8px;padding:12px 16px;margin:10px 0;font-size:14px;color:#7A5C00}
.tip strong{color:#B8860B}
.guide{background:#F0F7FF;border-left:4px solid #4A90D9;border-radius:0 8px 8px 0;padding:12px 16px;margin:10px 0;font-size:14px;color:#3A6B9E;line-height:1.7}
.day-card{background:#F9F7F2;border-radius:10px;padding:14px 16px;margin:10px 0}
.day-card .day-num{font-size:13px;font-weight:700;color:#5B8C5A;margin-bottom:4px}
.day-card .day-title{font-size:16px;font-weight:600;color:#333;margin-bottom:4px}
.day-card .day-point{font-size:14px;color:#666;line-height:1.7}
.day-card .day-point::before{content:"💡 ";font-size:13px}
.quiz-options{margin-top:10px}
.quiz-opt{display:block;width:100%;padding:14px 16px;margin-bottom:8px;border:2px solid #E8E8E8;border-radius:10px;background:#fff;font-size:15px;color:#555;cursor:pointer;transition:all .2s;text-align:left}
.quiz-opt:active{transform:scale(.98)}
.quiz-opt.selected-correct{border-color:#5B8C5A;background:#F2F8F2;color:#3D6B3D}
.quiz-opt.selected-wrong{border-color:#E8833A;background:#FFF3E0;color:#B5651D}
.quiz-opt.disabled{pointer-events:none;opacity:.6}
.quiz-feedback{margin-top:8px;padding:10px 14px;border-radius:8px;font-size:14px;display:none;line-height:1.6}
.quiz-feedback.show{display:block}
.quiz-feedback.correct-fb{background:#E8F5E9;color:#2E7D32}
.quiz-feedback.wrong-fb{background:#FFF3E0;color:#E65100}
.insight{background:#F3E8FF;border-radius:10px;padding:16px 20px;margin:10px 0}
.insight-label{font-size:13px;color:#7C3AED;font-weight:600;margin-bottom:6px}
.insight-text{font-size:15px;color:#4A2A6B;line-height:1.7;font-weight:500}
.next-day{background:#F0ECE5;border-radius:10px;padding:14px 20px;margin:10px 0;font-size:14px;color:#888}
.sources{font-size:12px;color:#BBB;padding:16px 20px;line-height:1.6}
.sources .src{margin-bottom:4px}
.action-list{margin-top:8px}
.action-item{display:flex;align-items:flex-start;padding:12px 0;border-bottom:1px solid #F0F0F0;cursor:pointer}
